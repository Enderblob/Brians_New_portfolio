        transform: translateY(-3px);

        box-shadow: 0 16px 38px rgba(29, 76, 64, 0.14);
      }

      .mushroom-cap {
        transform-origin: 50% 70%;
        animation: breathe 3s ease-in-out infinite;
      }

      .mushroom-spark {
        animation: twinkle 1.8s ease-in-out infinite;
      }

      .mushroom-wave {
        transform-origin: 50% 50%;
        animation: wave 1.8s ease-in-out infinite;
      }

      .card-enter {
        animation: cardIn 420ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .aura-glow {
        animation: glow 4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-5px) scale(1.035);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      @keyframes wave {
        0%,
        100% {
          transform: rotate(-4deg);
        }
        50% {
          transform: rotate(10deg);
        }
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes glow {
        0%,
        100% {
          filter: saturate(1) brightness(1);
        }
        50% {
          filter: saturate(1.12) brightness(1.04);
        }
      }

      function shareAura(platform, persona, score) {
        const shareUrl = window.location.href.startsWith("file:")
          ? "https://thryvesuperfoodsus.com/products"
          : window.location.href;
        const text = `I got ${persona.title} on the Thryve Energy Aura Test with an aura score of ${score}. My match: ${persona.product.name}.`;
        const encodedText = encodeURIComponent(text);
        const encodedUrl = encodeURIComponent(shareUrl);

        if (platform === "instagram") {
          const caption = `${text} ${shareUrl}`;
          if (navigator.share) {
            navigator.share({ title: "My Thryve Aura", text, url: shareUrl });
            return;
          }
          navigator.clipboard?.writeText(caption);
          alert("Instagram does not support direct web posting here, so your aura caption was copied.");
          return;
        }

        if (platform === "x") {
          window.open(
            `https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}`,
            "_blank",
            "noopener,noreferrer",
          );
          return;
        }

        window.open(
          `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`,
          "_blank",
          "noopener,noreferrer",
        );
      }

        useEffect(() => {
          setAppliedTag(applyThryveTag(persona.key, score));
        }, [persona.key, score]);

        return (
          <section className="rounded-[1.5rem] border border-thryveGreen/15 bg-white/80 p-5 shadow-aura backdrop-blur sm:p-6">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <p className="text-sm font-bold uppercase tracking-[0.18em] text-thryveOrange">
                  Limited Time Aura Offer
                </p>
                <h3 className="mt-2 font-display text-2xl text-thryveGreen">
                  Your 15-minute toolkit is unlocked
                </h3>
              </div>
              <div className="rounded-2xl bg-thryveGreen px-5 py-3 text-center text-white">
                <p className="font-display text-2xl">{formatTime(remaining)}</p>
                <p className="text-[11px] font-bold uppercase tracking-[0.2em] text-white/75">
                  Reserved
                </p>
              </div>
            </div>

            <div className="mt-6 overflow-hidden rounded-[1.25rem] border border-thryveGreen/12 bg-white">
              <div className="p-5">
                <p className="text-xs font-black uppercase tracking-[0.2em] text-thryveOrange">
                  Suggested Product
                </p>
                <h3 className="mt-2 font-display text-2xl leading-tight text-thryveGreen">
                  {persona.product.name}
                </h3>
                <p className="mt-1 font-semibold text-ink/65">{persona.product.subtitle}</p>
                <p className="mt-4 text-sm leading-6 text-ink/72">{persona.pitch}</p>
                <p className="mt-3 text-sm leading-6 text-ink/68">
                  Founding member pricing is reserved while your timer is active.
                </p>
              </div>

              <div className="relative h-64 overflow-hidden bg-thryveBeige">
                <img
                  src={persona.product.image}
                  alt={`${persona.product.name} product packaging`}
                  className="h-full w-full object-cover"
                  loading="lazy"
                />
                <div className="absolute left-4 top-4 rounded-full bg-white/90 px-3 py-1 text-xs font-black uppercase tracking-[0.14em] text-thryveGreen">
                  Aura Match
                </div>
                <div className="absolute bottom-4 right-4 rounded-full bg-thryveGreen px-4 py-2 font-display text-sm text-white">
                  {persona.product.price}
                </div>
              </div>
            </div>

            <button
              className="mt-6 w-full rounded-full bg-thryveOrange px-6 py-4 font-display text-sm uppercase tracking-[0.12em] text-white shadow-lg shadow-thryveOrange/25 transition hover:-translate-y-0.5 hover:bg-[#c94f25] focus:outline-none focus:ring-4 focus:ring-thryveOrange/25"
              type="button"
              onClick={() =>
                alert(`Discount route mocked with Shopify tag: ${appliedTag?.tag || "Aura_Explorer"}`)
              }
            >
              Add My Performance Toolkit
            </button>
          </section>
        );
      }

      function App() {
        const [started, setStarted] = useState(false);
        const [questionIndex, setQuestionIndex] = useState(0);
        const [score, setScore] = useState(50);
        const [answers, setAnswers] = useState([]);
        const [dialogue, setDialogue] = useState(
          "Welcome in. I'll read your energy field with professional-grade mushroom intuition.",
        );
        const [mood, setMood] = useState("neutral");

        const complete = answers.length === questions.length;
        const current = questions[questionIndex];
        const progress = complete ? 100 : Math.round((questionIndex / questions.length) * 100);
        const finalScore = clampScore(score);
        const persona = getPersona(finalScore);

        function chooseAnswer(answer) {
          const nextScore = clampScore(score + answer.delta);
          const nextAnswers = [...answers, answer];

          setScore(nextScore);
          setAnswers(nextAnswers);
          setMood(answer.type);
          setDialogue(answer.type === "healthy" ? current.healthyDialogue : current.unhealthyDialogue);

          window.setTimeout(() => {
            if (questionIndex + 1 < questions.length) {
              setQuestionIndex((index) => index + 1);
            }
          }, 260);
        }

        function resetQuiz() {
          setStarted(false);
          setQuestionIndex(0);
          setScore(50);
          setAnswers([]);
          setMood("neutral");
          setDialogue(
            "Welcome in. I'll read your energy field with professional-grade mushroom intuition.",
          );
        }

        return (
          <main className="relative min-h-screen overflow-hidden">
            <div className="topo pointer-events-none absolute inset-0 opacity-80"></div>
            <div className="broken-lines pointer-events-none absolute left-[-9rem] top-20 h-96 w-96 opacity-60"></div>
            <div className="broken-lines pointer-events-none absolute bottom-[-8rem] right-[-8rem] h-[30rem] w-[30rem] rotate-45 opacity-50"></div>

            <section className="relative z-10 mx-auto grid min-h-screen w-full max-w-7xl items-center gap-8 px-4 py-8 sm:px-6 lg:grid-cols-[0.92fr_1.08fr] lg:px-8">
              <aside className="card-enter">
                <div className="inline-flex items-center gap-2 rounded-full border border-thryveGreen/15 bg-white/70 px-4 py-2 text-sm font-bold text-thryveGreen shadow-sm backdrop-blur">
                  <span className="h-2.5 w-2.5 rounded-full bg-thryveOrange"></span>
                  Thryve Superfoods
                </div>
                <h1 className="mt-6 font-display text-4xl leading-[1.05] text-thryveGreen sm:text-5xl lg:text-6xl">
                  Thryve Energy Aura Test
                </h1>
                <p className="mt-5 max-w-xl text-lg leading-8 text-ink/75">
                  Discover whether your energy is primed for performance, ready for
                  balanced growth, or asking for deeper recovery support.
                </p>

                <div className="mt-8 rounded-[1.5rem] border border-thryveGreen/15 bg-white/70 p-5 shadow-aura backdrop-blur">
                  <MushroomMascot progress={progress} mood={mood} />
                  <div className="mt-4 rounded-2xl bg-thryveGreen px-5 py-4 text-white">
                    <p className="text-sm font-bold uppercase tracking-[0.16em] text-white/65">
                      Mushroom Dialogue
                    </p>
                    <p className="mt-2 text-lg font-semibold leading-7">{dialogue}</p>
                  </div>
                </div>
              </aside>

              <section className="card-enter rounded-[2rem] border border-thryveGreen/15 bg-white/75 p-4 shadow-aura backdrop-blur sm:p-6 lg:p-8">
                {!started ? (
                  <div className="grid gap-6 lg:grid-cols-[1fr_auto] lg:items-center">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.2em] text-thryveOrange">
                        5-question performance read
                      </p>
                      <h2 className="mt-4 font-display text-3xl leading-tight text-thryveGreen sm:text-4xl">
                        Your habits reveal the glow.
                      </h2>
                      <p className="mt-4 max-w-2xl text-base leading-7 text-ink/72">
                        Answer five quick lifestyle questions to generate an
                        Instagram-ready aura card and a timed Thryve toolkit offer.
                      </p>
                      <ArchetypeCards />
                    </div>
                    <button
                      className="rounded-full bg-thryveOrange px-8 py-4 font-display text-sm uppercase tracking-[0.14em] text-white shadow-lg shadow-thryveOrange/25 transition hover:-translate-y-0.5 hover:bg-[#c94f25] focus:outline-none focus:ring-4 focus:ring-thryveOrange/25"
                      type="button"
                      onClick={() => {
                        setStarted(true);
                        setDialogue("First read: morning energy. Be honest with the forest.");
                      }}
                    >
                      Begin Test
                    </button>
                  </div>
                ) : complete ? (
                  <div className="space-y-7">
                    <div>
                      <p className="text-sm font-bold uppercase tracking-[0.2em] text-thryveOrange">
                        Aura Revealed
                      </p>
                      <h2 className="mt-3 font-display text-3xl leading-tight text-thryveGreen sm:text-4xl">
                        {persona.title}
                      </h2>
                      <p className="mt-3 text-lg font-semibold text-ink/75">
                        {persona.focus}
                      </p>
                    </div>

                    <div className="grid gap-8 xl:grid-cols-[0.86fr_1.14fr] xl:items-start">
                      <AuraCard score={finalScore} persona={persona} />
                      <div className="space-y-5">
                        <OfferPanel persona={persona} score={finalScore} />
                      <button
                        className="w-full rounded-full border border-thryveGreen/20 bg-white/60 px-6 py-3 font-bold text-thryveGreen transition hover:bg-thryveBeige"
                        type="button"
                        onClick={resetQuiz}
                      >
                        Retake the Aura Test
                      </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <p className="text-sm font-bold uppercase tracking-[0.2em] text-thryveOrange">
                          {current.eyebrow}
                        </p>
                        <h2 className="mt-3 font-display text-3xl leading-tight text-thryveGreen sm:text-4xl">
                          {current.prompt}
                        </h2>
                      </div>
                      <div className="rounded-full bg-thryveBeige px-4 py-2 text-sm font-bold text-thryveGreen">
                        {questionIndex + 1} / {questions.length}
                      </div>
                    </div>

                    <div className="mt-6 h-3 overflow-hidden rounded-full bg-thryveGreen/10">
                      <div
                        className="h-full rounded-full bg-thryveOrange transition-all duration-500"
                        style={{ width: `${((questionIndex + 1) / questions.length) * 100}%` }}
                      ></div>
                    </div>

                    <div className="mt-8 grid gap-4 md:grid-cols-2">
                      {current.answers.map((answer) => (
                        <button
                          key={answer.label}
                          type="button"
                          className="answer-card min-h-44 rounded-[1.25rem] border border-thryveGreen/15 bg-white/78 p-5 text-left focus:outline-none focus:ring-4 focus:ring-thryveOrange/20"
                          onClick={() => chooseAnswer(answer)}
                        >
                          <span
                            className={`inline-flex rounded-full px-3 py-1 text-xs font-black uppercase tracking-[0.16em] ${
                              answer.type === "healthy"
                                ? "bg-thryveGreen text-white"
                                : "bg-thryveOrange/15 text-thryveOrange"
                            }`}
                          >
                            {answer.type === "healthy" ? "Feels Supportive" : "Needs Support"}
                          </span>
                          <span className="mt-5 block font-display text-xl leading-snug text-thryveGreen">
                            {answer.label}
                          </span>
                          <span className="mt-3 block text-sm leading-6 text-ink/68">
                            {answer.description}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
