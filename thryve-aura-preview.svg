<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Thryve Energy Aura Test preview</title>
  <desc id="desc">A warm branded quiz interface preview with orange, green, and beige Thryve styling.</desc>
  <defs>
    <radialGradient id="aura" cx="38%" cy="28%" r="68%">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.38" stop-color="#d96030"/>
      <stop offset="0.72" stop-color="#1d4c40"/>
      <stop offset="1" stop-color="#17362f"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="1" stop-color="#efead3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#17362f" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#efead3"/>
  <circle cx="600" cy="510" r="430" fill="url(#aura)" opacity="0.98"/>
  <circle cx="886" cy="210" r="132" fill="#d96030" opacity="0.88"/>
  <circle cx="236" cy="970" r="176" fill="#1d4c40" opacity="0.85"/>
  <g filter="url(#shadow)">
    <rect x="176" y="180" width="848" height="760" rx="34" fill="url(#card)"/>
    <rect x="226" y="234" width="748" height="92" rx="46" fill="#1d4c40"/>
    <text x="600" y="294" text-anchor="middle" fill="#efead3" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5">THRYVE SUPERFOODS</text>
    <text x="600" y="434" text-anchor="middle" fill="#17362f" font-family="Arial, sans-serif" font-size="74" font-weight="800">Energy Aura Test</text>
    <text x="600" y="500" text-anchor="middle" fill="#385d53" font-family="Arial, sans-serif" font-size="30">Find your focus, flow, and fuel.</text>
    <rect x="290" y="578" width="620" height="68" rx="34" fill="#ffffff" opacity="0.86"/>
    <rect x="290" y="674" width="620" height="68" rx="34" fill="#ffffff" opacity="0.86"/>
    <rect x="290" y="770" width="620" height="68" rx="34" fill="#d96030"/>
    <text x="600" y="622" text-anchor="middle" fill="#17362f" font-family="Arial, sans-serif" font-size="27" font-weight="700">Calm Focus</text>
    <text x="600" y="718" text-anchor="middle" fill="#17362f" font-family="Arial, sans-serif" font-size="27" font-weight="700">Creative Charge</text>
    <text x="600" y="814" text-anchor="middle" fill="#fff7dc" font-family="Arial, sans-serif" font-size="27" font-weight="800">Start Quiz</text>
  </g>
</svg>
