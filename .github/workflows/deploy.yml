name: Deploy Skadis LiDAR Aligner To GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Static Site
        run: npm run build

      - name: Compose Portfolio Site
        run: |
          mkdir -p public-site/skadis-lidar-aligner
          cp index.html script.js styles.css projects.json experiences.json skadis-lidar-aligner-preview.svg public-site/
          cp thryve-aura-test.html public-site/
          cp -R out/_next public-site/_next
          cp out/index.html public-site/skadis-lidar-aligner/index.html
          cp out/index.txt public-site/skadis-lidar-aligner/index.txt
          touch public-site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To Pages
        id: deployment
        uses: actions/deploy-pages@v4
